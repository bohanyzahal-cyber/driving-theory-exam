  <title>המערכת עברה לכתובת חדשה</title>
  <script>
  // 26/09/2026 cut-over: the exams run on the new system, and this page only
  // sends people there.
  // The installed examinee app (manifest start_url) used to show examinee.html
  // in an iframe here; it now goes straight to the new address.
  // It registers no service worker and reads or writes no storage: the practice
  // pages (teacher.html, student.html) share this origin and its worker scope,
  // and keep running here unchanged. top, not self: the old installed apps
  // showed the exam pages inside an iframe. replace, not assign: the back
  // button must not land here again.
  (function () {
    var CUTOVER_REDIRECT = 'https://teoria-digital-vitaly.com/exam/';
    try { window.top.location.replace(CUTOVER_REDIRECT); }
    catch (e) { window.location.replace(CUTOVER_REDIRECT); }
  })();
  </script>
