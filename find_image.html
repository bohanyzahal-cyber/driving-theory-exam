<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>חיפוש תמונה — לבוחן</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2.0">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    margin: 0;
    background: #0f172a;
    color: #f1f5f9;
    direction: rtl;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    padding: 16px 20px;
    border-bottom: 2px solid #facc15;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 22px; color: #facc15; }
  header p { margin: 6px 0 0; font-size: 13px; color: #94a3b8; }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  .search-box {
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .search-box label {
    display: block;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .search-box input {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    border-radius: 8px;
    border: 2px solid #475569;
    background: #0f172a;
    color: #f1f5f9;
    direction: rtl;
    text-align: right;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-box input:focus {
    outline: none;
    border-color: #facc15;
    box-shadow: 0 0 0 3px rgba(250,204,21,0.15);
  }
  .hint { font-size: 12px; color: #64748b; margin-top: 6px; }

  .meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
    font-size: 13px;
    color: #94a3b8;
  }
  .meta strong { color: #f1f5f9; }
  .badge {
    background: #1e293b;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }

  .results { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    overflow: hidden;
  }
  .card .qtext {
    padding: 14px;
    font-size: 16px;
    line-height: 1.5;
    color: #f1f5f9;
    border-bottom: 1px solid #334155;
  }
  .card .qmeta {
    padding: 8px 14px;
    background: #0f172a;
    font-size: 12px;
    color: #94a3b8;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card img {
    display: block;
    width: 100%;
    max-height: 70vh;
    object-fit: contain;
    background: #fff;
  }
  .card .noimg {
    padding: 20px;
    text-align: center;
    color: #f87171;
    font-size: 14px;
    font-weight: 600;
  }
  .card .answers {
    padding: 12px 14px;
    background: #0f172a;
    font-size: 13px;
  }
  .card .answers ol { margin: 0; padding: 0 18px; }
  .card .answers li {
    padding: 4px 0;
    color: #cbd5e1;
  }
  .card .answers li.correct {
    color: #4ade80;
    font-weight: 700;
  }

  .empty, .loading {
    text-align: center;
    padding: 40px 20px;
    color: #94a3b8;
  }
  .empty .icon { font-size: 48px; margin-bottom: 8px; }

  .spinner {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 4px solid #334155;
    border-top-color: #facc15;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .controls button {
    padding: 8px 14px;
    background: #334155;
    color: #f1f5f9;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls button.active {
    background: #facc15;
    color: #0f172a;
  }
  .controls button:hover { background: #475569; }
  .controls button.active:hover { background: #facc15; }

  .full-image-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .full-image-overlay.active { display: flex; }
  .full-image-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .full-image-overlay .close-x {
    position: absolute;
    top: 14px;
    inset-inline-end: 14px;
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    font-weight: 700;
  }

  .lang-pick {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .lang-pick button {
    padding: 6px 12px;
    background: #334155;
    color: #f1f5f9;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .lang-pick button.active { background: #1a73e8; }
</style>
</head>
<body>

<header>
  <h1>🖼️ חיפוש תמונה לבוחן</h1>
  <p>הקלד כמה מילים מהשאלה שהנבחן מראה לך</p>
</header>

<!-- Auth-required blocker. Shown when localStorage credentials are missing
     (i.e. user landed here directly without logging in via examiner.html).
     Replaces the previous "small error in results area" UX that confused users. -->
<main>
  <div class="search-box">
    <label for="searchInput">חיפוש לפי טקסט השאלה:</label>
    <input id="searchInput" type="search" placeholder="לדוגמה: רכב בצומת, תמרור עצור, נסיעה לאחור..." autocomplete="off" autofocus>
    <div class="hint">מציג עד 8 תוצאות. הקלד לפחות 3 תווים.</div>
  </div>

  <div class="lang-pick" id="langPick">
    <button data-lang="he" class="active">עברית</button>
    <button data-lang="ru">רוסית</button>
    <button data-lang="ar">ערבית</button>
    <button data-lang="en">אנגלית</button>
    <button data-lang="am">אמהרית</button>
    <button data-lang="fr">צרפתית</button>
    <button data-lang="es">ספרדית</button>
  </div>

  <div class="meta" id="meta" style="display:none;">
    <span class="badge" id="countBadge">0 תוצאות</span>
    <span class="badge" id="dbStatus">טוען מאגר...</span>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>טוען את בנק השאלות…</p>
  </div>

  <div class="results" id="results"></div>

  <div class="empty" id="empty" style="display:none;">
    <div class="icon">🔎</div>
    <p>הקלד טקסט לחיפוש</p>
  </div>
</main>

<div class="full-image-overlay" id="fullOverlay" onclick="this.classList.remove('active')">
  <button class="close-x" onclick="event.stopPropagation();document.getElementById('fullOverlay').classList.remove('active');">✕</button>
  <img id="fullImg" alt="">
</div>

<!--
  The question bank is a STATIC, PUBLIC file in this repo (bank/<lang>.json,
  built by tools/build_bank.js). This page searches it in the browser - no
  server call, no examiner credentials, no searchQuestions action. The bank
  carries texts, answers and image names only; the correct-answer index stays
  on the server, so this page no longer marks the correct answer.
-->
<script src="shared/bank.js"></script>
<script>
(function() {
  'use strict';

  var LANG_LABELS = { he: 'עברית', ru: 'רוסית', ar: 'ערבית', en: 'אנגלית', am: 'אמהרית', fr: 'צרפתית', es: 'ספרדית' };
  var MAX_RESULTS = 8;
  var currentLang = 'he';
  var lastQuery = '';

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function el(id) { return document.getElementById(id); }

  function setStatus(text) { var s = el('dbStatus'); if (s) s.textContent = text; }
  function setLoading(on, text) {
    var l = el('loading');
    if (!l) return;
    l.style.display = on ? '' : 'none';
    if (on && text) { var p = l.querySelector('p'); if (p) p.textContent = text; }
  }
  function showError(text) {
    var results = el('results');
    if (results) results.innerHTML = '<div class="info-banner warn" style="margin:12px;color:#dc2626;">' + escHtml(text) + '</div>';
  }

  function showResults(matches) {
    var results = el('results'), empty = el('empty'), meta = el('meta'), countBadge = el('countBadge');
    results.innerHTML = '';
    if (!matches.length) {
      empty.style.display = '';
      empty.querySelector('p').textContent = 'לא נמצאו שאלות תואמות. נסה מילים אחרות.';
      meta.style.display = 'none';
      return;
    }
    empty.style.display = 'none';
    meta.style.display = '';
    countBadge.textContent = matches.length + ' תוצאות' + (matches.length >= MAX_RESULTS ? ' (מציג ' + MAX_RESULTS + ' ראשונות)' : '');

    matches.slice(0, MAX_RESULTS).forEach(function(q) {
      var card = document.createElement('div');
      card.className = 'card';

      var qtext = document.createElement('div');
      qtext.className = 'qtext';
      qtext.textContent = q.text || '(אין טקסט)';
      card.appendChild(qtext);

      // Images are self-hosted in this repo (images/TQ_PIC_*.jpg) since ee05859
      // - no proxy, no gov.il, nothing to fail at runtime.
      var imgSrc = QuestionBank.imageUrl(q);
      if (imgSrc) {
        var img = document.createElement('img');
        img.src = imgSrc;
        img.alt = 'תמונה לשאלה';
        img.loading = 'lazy';
        img.onerror = function() {
          img.style.display = 'none';
          var noimg = document.createElement('div');
          noimg.className = 'noimg';
          noimg.textContent = '⚠️ התמונה לא נטענה';
          card.insertBefore(noimg, img);
        };
        img.style.cursor = 'zoom-in';
        img.title = 'לחץ להגדלה';
        img.addEventListener('click', function() {
          el('fullImg').src = img.src;
          el('fullOverlay').classList.add('active');
        });
        card.appendChild(img);
      } else {
        var noimg2 = document.createElement('div');
        noimg2.className = 'noimg';
        noimg2.textContent = '— לשאלה זו אין תמונה —';
        card.appendChild(noimg2);
      }

      var qmeta = document.createElement('div');
      qmeta.className = 'qmeta';
      qmeta.innerHTML = '<span>📋 שאלה ' + escHtml(q.id) + '</span>';
      card.appendChild(qmeta);

      if (q.answers && q.answers.length) {
        var ansDiv = document.createElement('div');
        ansDiv.className = 'answers';
        var html = '<ol>';
        for (var i = 0; i < q.answers.length; i++) html += '<li>' + escHtml(q.answers[i]) + '</li>';
        ansDiv.innerHTML = html + '</ol>';
        card.appendChild(ansDiv);
      }

      results.appendChild(card);
    });
  }

  // Search runs against the bank of the CHOSEN language, loaded once and kept
  // in memory (and in the service-worker cache for the next visit).
  function runSearch(value) {
    lastQuery = value;
    var q = String(value || '').trim();
    if (q.length < 3) {
      el('results').innerHTML = '';
      el('empty').style.display = '';
      el('empty').querySelector('p').textContent = 'הקלד טקסט לחיפוש (לפחות 3 תווים)';
      return;
    }
    if (QuestionBank.has(currentLang)) {
      showResults(QuestionBank.search(currentLang, q, 50));
      return;
    }
    setLoading(true, 'טוען את בנק השאלות ב' + (LANG_LABELS[currentLang] || currentLang) + '…');
    QuestionBank.load(currentLang).then(function() {
      setLoading(false);
      setStatus('בנק מקומי — ' + (LANG_LABELS[currentLang] || currentLang));
      if (lastQuery === value) showResults(QuestionBank.search(currentLang, q, 50));
    }).catch(function() {
      setLoading(false);
      setStatus('הבנק לא נטען');
      showError('לא הצלחתי לטעון את בנק השאלות. בדוק חיבור ונסה שוב.');
    });
  }

  (function initUI() {
    setLoading(false);
    el('empty').style.display = '';
    el('meta').style.display = '';
    el('countBadge').textContent = '0 תוצאות';
    setStatus('בנק מקומי — עברית');
    QuestionBank.load('he').catch(function() {});
  })();

  var debounceTimer = null;
  el('searchInput').addEventListener('input', function() {
    var val = this.value;
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() { runSearch(val); }, 350);
  });

  el('langPick').addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON') return;
    var btns = this.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    e.target.classList.add('active');
    currentLang = e.target.getAttribute('data-lang');
    setStatus('בנק מקומי — ' + (LANG_LABELS[currentLang] || currentLang));
    var val = el('searchInput').value;
    if (val.length >= 3) runSearch(val);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') el('fullOverlay').classList.remove('active');
  });

  // Deep link from the commander dashboard's top-wrong table: ?q=<question text>.
  try {
    var params = new URLSearchParams(window.location.search);
    var qVal = params.get('q');
    if (qVal) {
      var inp = el('searchInput');
      if (inp) { inp.value = qVal; setTimeout(function() { runSearch(qVal); }, 100); }
    }
  } catch (e) { /* URLSearchParams missing - manual entry still works */ }
})();
</script>
</body>
</html>
